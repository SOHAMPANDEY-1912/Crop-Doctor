<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Doctor (offline)</title>
<style>
:root{--bg:#f3f7ef;--ink:#17261a;--card:#ffffff;--green:#2e7d32;--line:#d3e0cf;--warn:#b26a00;--bad:#b3261e;--mute:#5b6b5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Noto Sans Devanagari","Nirmala UI","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 14px}
header .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-size:17px;cursor:pointer}
.chip.on{background:#fff;color:var(--green);font-weight:700}
#net{font-size:14px;margin-top:4px}
main{max-width:760px;margin:0 auto;padding:14px}
.banner{border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.demo{background:#ffe9e7;border:2px solid var(--bad);color:var(--bad);font-weight:700}
.draft{background:#fff4dc;border:1px solid var(--warn);color:#6b4300}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button.big{font-size:20px;padding:14px 18px;border-radius:12px;border:0;background:var(--green);color:#fff;cursor:pointer;min-height:54px}
button.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
button.big:disabled{opacity:.5}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
video,#photo{width:100%;max-height:60vh;border-radius:12px;background:#000;object-fit:contain}
.bar{height:22px;border-radius:11px;background:#e6ede3;overflow:hidden;margin:6px 0}
.bar>div{height:100%}
.mild{background:#6aa84f}.moderate{background:#e69138}.severe{background:#cc0000}.conf{background:#3d85c6}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tab{border:2px solid var(--green);background:#fff;color:var(--green);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer}
.tab.on{background:var(--green);color:#fff}
ul{padding-left:22px;margin:6px 0}li{margin:6px 0}
.alert{background:#fdecea;border:2px solid var(--bad);border-radius:12px;padding:12px;margin:12px 0}
.alert h3{margin:0 0 6px;color:var(--bad)}
.mute{color:var(--mute);font-size:15px}
.ai{background:#eef3fb;border:1px dashed #3d85c6;border-radius:10px;padding:10px;margin-top:10px}
.top3 div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.hidden{display:none}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #cfd8cc;border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
footer{max-width:760px;margin:0 auto;padding:6px 14px 24px;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="row"><h1 data-t="title"></h1><div class="chips" id="chips"></div></div>
  <div id="net"></div>
</header>
<main>
  <div id="demoBanner" class="banner demo hidden">DEMO MODE: trained model not loaded. Results are NOT real. Pick a demo condition below.</div>

  <section id="capture" class="card">
    <div id="demoPick" class="hidden"><label>Demo condition: <select id="demoClass"></select></label></div>
    <p><strong data-t="takePhoto"></strong></p>
    <video id="video" autoplay playsinline muted class="hidden"></video>
    <p id="camNote" class="mute"></p>
    <div class="btns">
      <button class="big" id="shot" data-t="capture"></button>
      <button class="big alt" id="pick" data-t="choose"></button>
    </div>
    <input id="file" type="file" accept="image/*" class="hidden">
    <canvas id="canvas" class="hidden"></canvas>
  </section>

  <section id="loading" class="card hidden"><span class="spin"></span><span data-t="analyzing"></span></section>
  <section id="result" class="hidden"></section>
</main>
<footer data-t="footer"></footer>

const sevName = b => t(b);

function chips() {
  $("#chips").innerHTML = LANGS.map(([c, n]) => `<button class="chip ${c === lang ? "on" : ""}" data-l="${c}">${n}</button>`).join("");
  $("#chips").querySelectorAll("button").forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch (e) {} render(); });
}
function net() { $("#net").textContent = navigator.onLine ? t("online") : t("offline"); }

function topicItems(card, key) {
  const idx = SEVS.indexOf(R.severity_used || "moderate");
  if (key === "treat") { let out = []; for (let i = 0; i <= Math.max(idx, 0); i++) { const o = card.actions_by_severity[SEVS[i]] || {}; out = out.concat(asList(o[lang] || o.en)); } return out; }
  if (key === "symptoms") return asList(pick(card.symptoms));
  if (key === "why") return asList(pick(card.favourable_conditions));
  if (key === "prevent") return asList(pick(card.prevention));
  if (key === "organic") return asList(pick(card.organic_options));
  if (key === "escalate") return asList(pick(card.escalate_when));
  return [];
}

function contactsHTML(alertStyle) {
  const rows = (CFG.contacts || []).map(c => `<li><strong>${esc(pick(c.name))}</strong>: ${esc(c.phone)} ${c.verified ? "" : `<span class="mute">${esc(t("unverified"))}</span>`}</li>`).join("");
  return `<ul>${rows}</ul>`;
}

function renderResult() {
  const box = $("#result");
  if (!R) { box.classList.add("hidden"); return; }
  const card = R.card, names = R.top3[0].names, name = pick(names) || R.cls;
  let h = "";
  const meta = `<p class="mute">${esc(t("checkedIn"))}: ${R.ms.vision}${R.ms.severity ? " + " + R.ms.severity : ""} ms</p>`;
  const top3 = `<div class="card"><strong>${esc(t("others"))}</strong><div class="top3">${R.top3.map(x => `<div><span>${esc(pick(x.names) || x.cls)}</span><span>${Math.round(x.p * 100)}%</span></div>`).join("")}</div></div>`;
  const newBtn = `<div class="btns"><button class="big" id="again">${esc(t("newPhoto"))}</button></div>`;

  if (R.route === "retake") {
    h += `<div class="card"><h2>${esc(t("notSure"))}</h2><p>${esc(R.reason === "not_a_leaf" ? t("notALeaf") : t("retakeTips"))}</p><p class="mute">${esc(t("retakeTips"))}</p></div>${top3}${newBtn}`;
  } else if (R.route === "healthy") {
    h += `<div class="card"><h2>${esc(t("healthyMsg"))}</h2><p>${esc(name)}</p><div class="bar"><div class="conf" style="width:${Math.round(R.confidence * 100)}%"></div></div><p class="mute">${esc(t("sure"))}: ${Math.round(R.confidence * 100)}%</p></div>${meta}${newBtn}`;
  } else if (R.route === "no_card") {
    h += `<div class="card"><h2>${esc(t("found"))}: ${esc(name)}</h2><p>${esc(t("noCard"))}</p></div><div class="alert"><h3>${esc(t("contactTitle"))}</h3>${contactsHTML()}</div>${top3}${meta}${newBtn}`;
  } else {
    const pos = R.route === "possible", sev = R.severity, used = R.severity_used;
    const photo = `<img id="photo" src="${showOverlay && R.overlay ? R.overlay : photoURL}" alt="">`;
    const sevBlock = sev ? (sev.pct === null ? `<p class="mute">${esc(t("unclearSev"))}</p>` :
      `<strong>${esc(t("howBad"))}: ${esc(sevName(sev.bucket))} (${Math.round(sev.pct)}%)</strong><div class="bar"><div class="${sev.bucket}" style="width:${Math.min(100, Math.round(sev.pct))}%"></div></div>`) : "";
    h += `<div class="card">`;
    if (pos) h += `<div class="banner draft"><strong>${esc(t("possibleTitle"))}</strong><br>${esc(t("possibleHint"))}</div>`;
    h += `<h2 style="margin:4px 0">${esc(t("found"))}: ${esc(name)}</h2>
      <strong>${esc(t("sure"))}: ${Math.round(R.confidence * 100)}%</strong><div class="bar"><div class="conf" style="width:${Math.round(R.confidence * 100)}%"></div></div>
      ${sevBlock}${photo}
      ${R.overlay ? `<div class="btns"><button class="big alt" id="ovl">${esc(showOverlay ? t("hideArea") : t("showArea"))}</button></div>` : ""}</div>`;
    if (R.severe_alert) h += `<div class="alert"><h3>${esc(t("contactTitle"))}</h3><p>${esc(t("severeText"))}</p>${contactsHTML()}</div>`;
    if (card && (String(card.status || "").toUpperCase().startsWith("DRAFT") || card.reviewed_by === "pending")) h += `<div class="banner draft">${esc(t("draft"))}</div>`;
    h += `<div class="card"><p><strong>${esc(pick(card.summary))}</strong></p>
      <div class="btns">${CFG.speak ? `<button class="big alt" id="listen">${esc(t("listen"))}</button>` : ""}</div>
      <div class="tabs">${TOPICS.map(([k, lab]) => `<button class="tab ${k === topic ? "on" : ""}" data-k="${k}">${esc(t(lab))}</button>`).join("")}</div>
      <ul>${topicItems(card, topic).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    if (!R.severe_alert) h += `<div class="card"><div class="btns"><button class="big alt" id="contact">${esc(t("contactTitle"))}</button></div><div id="contactBox" class="hidden">${contactsHTML()}</div></div>`;
    h += `<div class="card"><div class="btns"><button class="big alt" id="aiBtn">${esc(t("aiBtn"))}</button></div><div id="aiOut"></div></div>${pos ? top3 : ""}${meta}${newBtn}`;
  }
  box.innerHTML = h;
  box.classList.remove("hidden");
  wire();
  if (ai) showAI();
}

function showAI() {
  const out = $("#aiOut"); if (!out || !ai) return;
  if (ai === "wait") { out.innerHTML = `<div class="ai"><span class="spin"></span></div>`; return; }
  if (!ai.available) { out.innerHTML = `<div class="ai">${esc(t("aiUnavailable"))}</div>`; return; }
  if (!ai.text) { out.innerHTML = `<div class="ai">${esc(t("aiHidden"))}</div>`; return; }
  out.innerHTML = `<div class="ai">${esc(ai.text)}<p class="mute">${esc(t("aiNote"))}</p></div>`;
}

function wire() {
  const g = id => document.getElementById(id);
  if (g("again")) g("again").onclick = reset;
  if (g("ovl")) g("ovl").onclick = () => { showOverlay = !showOverlay; renderResult(); };
  if (g("contact")) g("contact").onclick = () => g("contactBox").classList.toggle("hidden");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { topic = b.dataset.k; renderResult(); });
  if (g("listen")) g("listen").onclick = async () => {
    const card = R.card;
    const text = pick(card.summary) + " " + topicItems(card, "treat").join(" ");
    try { const r = await fetch(`/api/speak?lang=${lang}&text=${encodeURIComponent(text)}`); if (!r.ok) throw 0; new Audio(URL.createObjectURL(await r.blob())).play(); } catch (e) {}
  };
  if (g("aiBtn")) g("aiBtn").onclick = async () => {
    ai = "wait"; showAI();
    try {
      const r = await fetch("/api/explain", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({cls: R.cls, confidence: R.confidence, severity: R.severity_used, lang: lang === "bn" || lang === "as" ? "en" : lang})});
      ai = await r.json();
    } catch (e) { ai = {available: false}; }
    showAI();
  };
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  chips(); net(); renderResult();
}

async function startCamera() {
  const v = $("#video");
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}}, audio: false});
    v.srcObject = stream; v.classList.remove("hidden"); $("#camNote").textContent = "";
  } catch (e) { v.classList.add("hidden"); $("#camNote").textContent = t("noCamera"); }
}
function stopCamera() { if (stream) { stream.getTracks().forEach(x => x.stop()); stream = null; } }

async function analyze(blob) {
  stopCamera();
  $("#capture").classList.add("hidden"); $("#loading").classList.remove("hidden"); $("#result").classList.add("hidden");
  if (photoURL) URL.revokeObjectURL(photoURL);
  photoURL = URL.createObjectURL(blob); showOverlay = false; ai = null; topic = "treat";
  const fd = new FormData(); fd.append("image", blob, "leaf.jpg");
  if (CFG.demo) fd.append("demo_class", $("#demoClass").value);
  try {
    const r = await fetch("/api/analyze", {method: "POST", body: fd});
    if (!r.ok) throw new Error("bad response");
    R = await r.json();
  } catch (e) { R = {route: "retake", reason: "low_confidence", cls: "", confidence: 0, top3: [{names: {en: ""}, p: 0, cls: ""}], ms: {vision: 0}}; }
  $("#loading").classList.add("hidden"); renderResult();
}
function reset() { R = null; ai = null; $("#result").classList.add("hidden"); $("#capture").classList.remove("hidden"); if (!CFG.picam) startCamera(); }

$("#shot").onclick = async () => {
  if (CFG.picam) {                                   // Raspberry Pi: the app takes the photo with its own camera
    $("#capture").classList.add("hidden"); $("#loading").classList.remove("hidden");
    try { const r = await fetch("/api/capture", {method: "POST"}); if (r.ok) { analyze(await r.blob()); return; } } catch (e) {}
    $("#loading").classList.add("hidden"); $("#capture").classList.remove("hidden"); $("#camNote").textContent = t("noCamera"); return;
  }
  const v = $("#video"), c = $("#canvas");
  if (!stream || !v.videoWidth) { $("#file").click(); return; }
  c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(b => analyze(b), "image/jpeg", 0.9);
};
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => { if (e.target.files[0]) analyze(e.target.files[0]); e.target.value = ""; };
window.addEventListener("online", net); window.addEventListener("offline", net);

(async function init() {
  try { CFG = await (await fetch("/api/config")).json(); } catch (e) { CFG = {contacts: []}; }
  if (CFG.demo) {
    $("#demoBanner").classList.remove("hidden"); $("#demoPick").classList.remove("hidden");
    $("#demoClass").innerHTML = (CFG.classes || []).map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  }
  render(); if (CFG.picam) { $("#camNote").textContent = t("picamReady"); } else { startCamera(); }
})();
})();
</script>
</body>
</html>
